<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#viewer{width:100vw;height:100vh}</style><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head><body><div id="viewer"></div><script type="module">
import{PrefabViewer}from'/prefab-viewer/PrefabViewer.js';
const q=new URLSearchParams(location.search);window.renderReady=false;window.renderError=null;
try{
 const icon=q.get('mode')==='icon';
 const viewer=new PrefabViewer(document.querySelector('#viewer'),{interactive:false,fullscreenButton:false,hideGrid:icon,transparentBackground:icon});
 await viewer.loadPrefabUrl('/internal/prefab/'+encodeURIComponent(q.get('key')),{frontFacing:q.get('front')||'North'});
 if(viewer.undrawn?.length)throw new Error('Incomplete native render: '+viewer.undrawn.map(x=>x.reason+' (x'+x.count+')').join(', '));
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 viewer.renderer.render(viewer.scene,viewer.camera);window.renderReady=true;
}catch(e){window.renderError=e.message;}
</script></body></html>
